[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "1.0.0"
description = "Streaming fraud detection demo with graph signals, explanations, and drift monitoring"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<1.7",
  "scipy>=1.11,<2",
  "lightgbm==4.5.0",
  "networkx>=3.3,<4",
  "joblib>=1.4,<2",
  "kafka-python-ng>=2.2,<3",
  "prometheus-client>=0.20,<1",
  "SQLAlchemy>=1.4,<2",
  "mlflow==2.16.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.7,<1"]
monitoring = ["evidently>=0.4.30,<0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 110
target-version = "py311"
